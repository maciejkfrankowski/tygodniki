name: sroda-ai-redaktor
on:
  schedule:
    - cron: "0 17 * * 3"     # środa 17:00 UTC = 19:00 PL
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python ai_redaktor.py
      - run: |
          git config user.name "tygodnik-bot"
          git config user.email "bot@noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "szkice AI tresc"
          git push
