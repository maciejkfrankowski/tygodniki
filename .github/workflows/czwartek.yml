name: czwartkowy-build
on:
  schedule:
    - cron: "0 5 * * 4"      # czwartek 05:00 UTC = 07:00 PL
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python build_newsletter.py  
      - run: |
          git config user.name "tygodnik-bot"
          git config user.email "bot@noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "czwartkowy build"
            for i in 1 2 3; do
              if git push; then break; fi
              echo "push odrzucony, robię rebase i próbuję ponownie ($i/3)..."
              git pull --rebase origin main
            done
          fi
 
