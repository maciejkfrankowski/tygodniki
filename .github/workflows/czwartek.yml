name: czwartkowy-build
on:
  schedule:
    - cron: "0 5 * * 4"      # czwartek 05:00 UTC = 07:00 PL
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python build_newsletter.py
      - run: |
          git config user.name "tygodnik-bot"
          git config user.email "bot@noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "czwartkowy build"
          git push
